name: Keep Supabase warm

# Supabase pauses free-tier projects after ~7 days without database activity,
# which would silently break the guestbook. This runs a tiny real query
# against the `messages` table twice a week so the project never idles out.
#
# Note: GitHub disables scheduled workflows in repos with no commits for
# 60 days. If that happens, re-enable it from the Actions tab (or just run
# it manually with "Run workflow").

on:
  schedule:
    # 09:00 UTC every Monday and Thursday
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The URL and anon key are public values already committed in
      # .env.production (writes are protected by RLS), so no secrets needed.
      - name: Read Supabase config
        run: |
          grep -E '^NEXT_PUBLIC_SUPABASE_(URL|ANON_KEY)=' .env.production >> "$GITHUB_ENV"

      - name: Query the messages table
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/messages?select=id&limit=1" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $status"
            exit 1
          fi
